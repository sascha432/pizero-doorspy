# doorspy MediaMTX: RTSP + WebRTC passthrough (login required) of the camera's H.264, nothing else.
logLevel: info

rtsp: true
rtspTransports: [udp, tcp]
rtspAddress: :8554
webrtc: true
webrtcAddress: :8889
rtmp: false
hls: false
srt: false
moq: false

# Every client is checked by camera.py (127.0.0.1:8081, a child process): publish only from
# localhost, read with the stream login (stream.auth) or the web UI's admin login, as on :8080.
authMethod: http
authHTTPAddress: http://127.0.0.1:8081/mediamtx/auth

paths:
  cam:
    source: publisher
