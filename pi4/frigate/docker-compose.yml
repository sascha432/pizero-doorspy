# Frigate NVR for doorspy on acidpi4 (Debian 13, aarch64, Docker 29).
# Lives in /opt/frigate on the Pi 4:  docker compose up -d
services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "256mb"            # Frigate reports min_shm 148 MB for one 1280x768 camera
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Mosquitto runs on the host, not in Docker
    environment:
      TZ: America/Vancouver
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      # Encrypted RAID1. /media/1/frigate only exists once the volume is unlocked and
      # mounted; create_host_path: false makes Frigate fail to start instead of silently
      # recording onto the SSD underneath the mount point.
      - type: bind
        source: /media/1/frigate
        target: /media/frigate
        bind:
          create_host_path: false
      - type: tmpfs                           # segment cache in RAM, spares the SSD
        target: /tmp/cache
        tmpfs:
          size: 512000000
    ports:
      - "8971:8971"              # web UI with login
      - "127.0.0.1:5000:5000"    # unauthenticated API, host only, for Home Assistant
      - "8554:8554"              # RTSP restream (rtsp://acidpi4:8554/doorspy)
      - "8555:8555/tcp"          # WebRTC
      - "8555:8555/udp"
